<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('')
            // const [isLoading, setIsLoading] = React.useState(false)

            function saveInputText(event) {
                setInputText(event.target.value)
            }

            async function sendMessage() {
                if (!inputText.trim()) {
                    return
                }

                // setIsLoading(true)
                setInputText('')
                const loadingId = crypto.randomUUID()
                const newMessages = [
                    ...chatMessages,
                    {
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID()
                    }, {
                        message: 'Loading',
                        sender: 'robot',
                        id: loadingId
                    }

                ]
                setChatMessages(newMessages)

                const response = await chatbot.getResponseAsync(inputText)
                console.log(response)
                setChatMessages((prevMessages) => {
                    return prevMessages.map((msg) => {
                        return msg.id === loadingId ? { ...msg, message: response } : msg
                    })
                })
                // setChatMessages(
                //     (prevMessages) =>
                //         prevMessages.map((msg) =>
                //             msg.id === loadingId ? { ...msg, message: response } : msg
                //         )
                // )

                // setChatMessages([
                //     ...newMessages,
                //     {
                //         message: response,
                //         sender: 'robot',
                //         id: crypto.randomUUID()
                //     }
                // ])
                // setIsLoading(false)
            }

            function sendMessageOnKey(event) {
                if (event.key === 'Enter') {
                    sendMessage()
                }
            }
            return (
                <div className="input-container">
                    <input
                        placeholder="send a message to the chatbot"
                        size="30"
                        onChange={saveInputText}
                        onKeyDown={sendMessageOnKey}
                        value={inputText}
                        className="input-box"
                    ></input>
                    <button
                        onClick={sendMessage}

                        className="send-button"
                    >send
                    </button>

                </div>
            )
        }

        function ChatMessage({ message, sender }) {
            return (
                <div className={sender === 'user' ? 'chat-message-user' : 'chat-message-robot'}>
                    {sender === 'robot' && (<>
                        <img src="robot.png" className="profileImage" width="40"></img>
                    </>)}
                    <div className='display-message'>
                        {message}
                    </div>

                    {sender === 'user' && (<>
                        <img src="user.png" width="40" className="profileImage"></img>
                    </>)}
                </div>
            )
        }

        function ChatMessages({ chatMessages }) {
            return (
                <div className="chat-container">
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                key={chatMessage.id}
                                sender={chatMessage.sender}
                                message={chatMessage.message}
                            />
                        )
                    })}
                </div>
            )
        }

        function App() {
            const [chatMessages, setChatMessages] = React.useState([{
                id: '1231',
                message: 'Welcome to the chatbot',
                sender: 'robot'
            }])

            return (
                <div className="app-container">
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages} />
                    <ChatMessages
                        chatMessages={chatMessages}
                    />

                </div>
            )
        }

    </script>

    <script type="text/babel">
        const container = document.querySelector('.js-container')
        const root = ReactDOM.createRoot(container)
        root.render(<App />)

    </script>

</body>
